apiVersion: apps/v1
kind: Deployment
metadata:
  name: k8s-staticroute-operator
spec:
  replicas: 1
  selector:
    matchLabels:
      name: k8s-staticroute-operator
  template:
    metadata:
      labels:
        name: k8s-staticroute-operator
    spec:
      serviceAccountName: k8s-staticroute-operator
      tolerations:
        - operator: Exists
      containers:
        - name: k8s-staticroute-operator
          image: <CONTAINER_REGISTRY>/k8s-staticroute-operator:<OPERATOR_RELEASE>
          imagePullPolicy: Always
          resources:
            requests:
              memory: "100Mi"
            limits:
              memory: "512Mi"
          securityContext:
            readOnlyRootFilesystem: true
            capabilities:
              add:
                - NET_ADMIN
          env:
            - name: TOKEN
              valueFrom:
                secretKeyRef:
                  name: static-route-operator-token
                  key: service-token
            - name: OPERATOR_NAME
              value: "k8s-staticroute-operator"
            - name: NODE_HOSTNAME
              valueFrom:
                fieldRef:
                  fieldPath: spec.nodeName
